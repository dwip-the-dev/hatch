name = "hatch-edge"
main = "src/index.ts"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
ALLOWED_SLOTS = "*"

[durable_objects]
bindings = [
  { name = "TUNNEL_HUB", class_name = "TunnelHub" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TunnelHub"]
